name: Train model and publish release

on:
  push:
    branches: [ "main" ]
    paths:
      - "training/**"
      - ".github/workflows/**"

permissions:
  contents: write  # allows tagging + releases

jobs:
  train_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to create/push tags safely

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/requirements.txt

      - name: Train model
        run: |
          python training/ML_Train_2.py

      - name: Read semantic version
        id: ver
        run: |
          VER="$(cat training/MODEL_VERSION | tr -d ' \n\r')"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "MODEL_VERSION must be X.Y.Z (e.g. 1.2.3). Got: '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists. Bump training/MODEL_VERSION."
            exit 1
          fi

      - name: Create and push git tag
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/football_model.pkl
            dist/elo_ratings.pkl
            dist/metadata.json
            dist/matches_snapshot.parquet
