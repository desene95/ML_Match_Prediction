name: Manual match prediction

on:
  workflow_dispatch:
    inputs:
      home_team:
        description: "Home team name (must match dataset team names exactly)"
        required: true
        type: string
      away_team:
        description: "Away team name (must match dataset team names exactly)"
        required: true
        type: string
      home_odds:
        description: "Home win decimal odds (e.g. 1.85)"
        required: true
        type: string
      draw_odds:
        description: "Draw decimal odds (e.g. 3.60)"
        required: true
        type: string
      away_odds:
        description: "Away win decimal odds (e.g. 4.20)"
        required: true
        type: string
      match_date:
        description: "Match date YYYY-MM-DD (optional; used for last-5 lookup)"
        required: false
        type: string

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r predict/requirements.txt

      - name: Download latest model release assets
        run: |
          mkdir -p models
          python predict/download_latest_release_assets.py

      - name: Run single match prediction
        run: |
          python predict/predict_game.py \
            --home-team "${{ inputs.home_team }}" \
            --away-team "${{ inputs.away_team }}" \
            --home-odds "${{ inputs.home_odds }}" \
            --draw-odds "${{ inputs.draw_odds }}" \
            --away-odds "${{ inputs.away_odds }}" \
            --match-date "${{ inputs.match_date }}" \
            --model-path models/football_model.pkl \
            --elo-path models/elo_ratings.pkl \
            --metadata-path models/metadata.json \
            --matches-path models/matches_snapshot.parquet \
            --out outputs/prediction.json

      - name: Upload prediction output
        uses: actions/upload-artifact@v4
        with:
          name: prediction
          path: outputs/prediction.json
